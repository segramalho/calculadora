<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10131c" />
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="calculator" aria-label="Calculadora">
      <header class="topbar">
        <span class="brand-mark" aria-hidden="true">⌗</span>
        <div>
          <p class="eyebrow">FERRAMENTA</p>
          <h1>Calculadora</h1>
        </div>
        <span class="status"><i></i> Pronta</span>
      </header>

      <section class="display" aria-live="polite" aria-atomic="true">
        <p class="expression" id="expression">&nbsp;</p>
        <output id="result" class="result">0</output>
      </section>

      <section class="keys" aria-label="Teclado">
        <button class="utility" data-action="clear">AC</button>
        <button class="utility" data-action="sign" aria-label="Trocar sinal">+/−</button>
        <button class="utility" data-action="percent">%</button>
        <button class="operator" data-operator="÷" aria-label="Dividir">÷</button>

        <button data-digit="7">7</button><button data-digit="8">8</button><button data-digit="9">9</button>
        <button class="operator" data-operator="×" aria-label="Multiplicar">×</button>

        <button data-digit="4">4</button><button data-digit="5">5</button><button data-digit="6">6</button>
        <button class="operator" data-operator="−" aria-label="Subtrair">−</button>

        <button data-digit="1">1</button><button data-digit="2">2</button><button data-digit="3">3</button>
        <button class="operator" data-operator="+" aria-label="Somar">+</button>

        <button class="utility" data-action="backspace" aria-label="Apagar último dígito">⌫</button>
        <button data-digit="0">0</button><button data-action="decimal">,</button>
        <button class="equals" data-action="equals" aria-label="Igual">=</button>
      </section>
      <footer>Use o teclado ou clique nos botões</footer>
    </main>
  </body>
</html>
